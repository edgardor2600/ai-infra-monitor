services:
  - type: web
    name: ai-infra-monitor-api
    env: python
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
        value: "5432"
      - key: DB_NAME
        sync: false
        value: "postgres"
      - key: DB_USER
        sync: false
        value: "postgres"
      - key: DB_PASSWORD
        sync: false
      - key: LLM_PROVIDER
        value: "minimax"
      - key: MINIMAX_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true

  - type: worker
    name: ai-infra-monitor-worker
    env: python
    dockerfilePath: Dockerfile
    buildCommand: ""
    startCommand: python backend/worker/run_worker.py
    plan: free
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
        value: "5432"
      - key: DB_NAME
        sync: false
        value: "postgres"
      - key: DB_USER
        sync: false
        value: "postgres"
      - key: DB_PASSWORD
        sync: false
      - key: LLM_PROVIDER
        value: "minimax"
      - key: MINIMAX_API_KEY
        sync: false
